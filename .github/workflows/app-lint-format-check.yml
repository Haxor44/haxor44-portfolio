name: Go app linting and formatting

on:
    workflow_call

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
           
            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                go-version: 1.26.0

                check-latest: false

                cache: true 

                cache-dependency-path: go.sum

            - name: Install golangci-lint
              uses: golangci/golangci-lint-action@v8
              with:
                version: latest
                args: --timeout 5m

                    

                        

